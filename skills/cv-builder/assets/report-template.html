<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV analysis</title>
<style>
:root {
  --bg: #f6f6f3; --surface: #ffffff; --ink: #17181c; --muted: #5d616b; --line: #e1e1dc;
  --accent: #2f4a8a; --accent-soft: #e8edf8;
  --good: #1f7a4d; --good-soft: #e3f3ea;
  --warn: #9a6200; --warn-soft: #fbf0d9;
  --bad: #b3312b; --bad-soft: #fbe6e4;
  --track: #e6e6e1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131417; --surface: #1c1e23; --ink: #ecedf0; --muted: #a2a7b3; --line: #30333b;
    --accent: #9db4ee; --accent-soft: #252c40;
    --good: #6fd09b; --good-soft: #1b3327;
    --warn: #e9b65a; --warn-soft: #3a2e14;
    --bad: #f08d86; --bad-soft: #3f211f;
    --track: #2c2f37;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 80px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.01em; }
h2 { font-size: 18px; margin: 0 0 14px; }
h3 { font-size: 14px; margin: 0 0 8px; }
p { margin: 0 0 10px; }
a { color: var(--accent); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.sub { color: var(--muted); margin: 0 0 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 18px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--muted);
}
.summary { font-size: 17px; line-height: 1.5; max-width: 70ch; margin-bottom: 24px; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; margin-top: 16px; }
.count { color: var(--muted); font-weight: 400; }
.empty { color: var(--muted); margin: 0; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.tile .label { font-size: 13px; color: var(--muted); font-weight: 600; }
.tile .big { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile .big small { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.tile .note { font-size: 13px; color: var(--muted); }
.ring { position: relative; width: 104px; height: 104px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring .bg { stroke: var(--track); }
.ring .fg { stroke-linecap: round; }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--accent-soft); color: var(--accent); }
.good-stroke { stroke: var(--good); } .warn-stroke { stroke: var(--warn); } .bad-stroke { stroke: var(--bad); }
.good-fill { background: var(--good); } .warn-fill { background: var(--warn); } .bad-fill { background: var(--bad); }

.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 190px 1fr 52px; gap: 12px; align-items: center; }
.bar-row .name { font-weight: 600; }
.bar-row .name span { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.bar { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; }
.bar-row .pct { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 0 12px 8px 0; }
td { padding: 10px 12px 10px 0; border-top: 1px solid var(--line); vertical-align: top; }
td.evidence { color: var(--muted); }
tr.group td { border-top: 0; padding: 18px 0 6px; font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.kw { padding: 3px 10px; border-radius: 6px; font-size: 13px; border: 1px solid var(--line); }
.kw.found { background: var(--good-soft); color: var(--good); border-color: transparent; }
.kw.missing { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.kw.high { font-weight: 700; }
.legend { font-size: 12.5px; color: var(--muted); margin: 0; }

.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
.check { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; align-content: start; }
.check .what { font-weight: 600; }
.check .why { grid-column: 1 / -1; color: var(--muted); font-size: 13.5px; }

.cards { display: grid; gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
.card .head strong { font-size: 15px; }
.card p { margin: 0; color: var(--muted); }
.card .src { margin-top: 8px; font-size: 12.5px; }

.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.cols ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.cols li { border-left: 3px solid var(--line); padding-left: 10px; }
.cols li.rm { border-color: var(--bad); } .cols li.ad { border-color: var(--good); } .cols li.rw { border-color: var(--warn); }
.cols li span { display: block; color: var(--muted); font-size: 13.5px; }
.cols li em { font-style: normal; font-size: 12px; color: var(--warn); font-weight: 600; }

.research { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.research li span { display: block; color: var(--muted); font-size: 13.5px; }

.form-intro { color: var(--muted); max-width: 70ch; }
.q { border-top: 1px solid var(--line); padding: 18px 0; }
.q .topic { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.q .text { font-weight: 600; font-size: 16px; margin: 2px 0 10px; }
.q label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
.q label.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.q label.opt input { margin-top: 4px; accent-color: var(--accent); }
.q label.opt b { min-width: 16px; }
.q .rec { font-size: 12px; color: var(--accent); font-weight: 600; margin-left: 6px; white-space: nowrap; }
.q textarea, #answers-out {
  display: block; width: 100%; height: 46px; min-height: 46px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font: inherit; resize: vertical;
}
.q .own { font-size: 13px; color: var(--muted); margin: 8px 0 4px; display: block; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0 12px; }
button {
  font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--surface); cursor: pointer;
}
button.ghost { background: transparent; color: var(--accent); }
#copied { color: var(--good); font-weight: 600; }
#answers-out { height: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
details { margin-top: 16px; color: var(--muted); font-size: 13.5px; }
details summary { cursor: pointer; font-weight: 600; }
details p { margin: 8px 0 0; max-width: 80ch; }

@media (max-width: 860px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .cols, .checks { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 1fr 52px; }
  .bar-row .bar { grid-column: 1 / -1; grid-row: 2; }
}
@media (max-width: 460px) { .tiles { grid-template-columns: 1fr; } }
@media print {
  body { background: #fff; } section, .tile { break-inside: avoid; }
  #form-section .actions, #answers-out { display: none; }
}
</style>
</head>
<body>
<main id="app"></main>
<script id="cv-data" type="application/json">/*__CV_DATA__*/</script>
<script>
(function () {

  var raw = document.getElementById("cv-data").textContent;
  var app = document.getElementById("app");

  var T = {

      atsTitle: "ATS checks", checksPassed: "{n} of 10 passed",
      checks: {

        contact_in_body: "Contact details in the body", date_format: "Consistent dates",
        reverse_chronological: "Newest first", title_alignment: "Title matches the posting", plain_characters: "Plain fonts and characters"
      },
      contraTitle: "Contradictions and gaps", contraNone: "No contradictions between the sources.", sourcesLabel: "Sources",
      changes: "Proposed changes", remove: "Remove", add: "Add", rewrite: "Rewrite", confirm: "Needs your confirmation", nothing: "Nothing proposed.",

        reverse_chronological: "Nyeste først", title_alignment: "Tittel samsvarer med annonsen", plain_characters: "Vanlige fonter og tegn"

      contraTitle: "Motsigelser og hull", contraNone: "Ingen motsigelser mellom kildene.", sourcesLabel: "Kilder",

      research: "Bakgrunn til skrivefasen", use: "Brukes i", source: "Kilde", researchNone: "Ingen funn registrert.",
      form: "Dine svar",
      formIntro: "Ingenting er skrevet om ennå. Svar på spørsmålene, trykk Kopier svar og lim resultatet inn i chatten. Velg en bokstav, skriv ditt eget svar, eller begge deler.",

      how: "Slik regnes poengene ut",
      how1: "Match: hvert krav teller 1 hvis det er oppfylt, 0,5 hvis delvis og 0 hvis det mangler. Kategoriene vektes: påkrevd kompetanse 50, erfaring 20, ønsket 15, utdanning 10, språk 5. 75 eller mer er god match, 50 til 74 delvis, under 50 svak.",

  };

  var t = T[D.meta.ui_lang] || T.en;
  var S = D.scores;
  var TONE = { high: "good", mid: "warn", low: "bad", met: "good", partial: "warn", missing: "bad", pass: "good", warn: "warn", fail: "bad" };

  }

  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function link(u, label) {
    return safeUrl(u) ? el("a", { href: u, target: "_blank", rel: "noopener", text: label || u }) : null;
  }

  // Header
  app.appendChild(el("div", { class: "eyebrow", text: t.title }));
  app.appendChild(el("h1", null, D.meta.role + " " + t.at + " " + D.meta.company));
  app.appendChild(el("p", { class: "sub", text: D.meta.candidate + " · " + D.meta.date }));
  var meta = el("div", { class: "meta" });

      D.contradictions.length

  var bars = el("div", { class: "bars" });

      el("div", { class: "name" }, t.cat[b.category],

      el("div", { class: "bar" }, fill),
      el("div", { class: "pct", text: b.pct + " %" })));
  });

  var tbody = el("tbody");
  ["must", "experience", "nice", "education", "language"].forEach(function (cat) {
    var rows = D.requirements.filter(function (r) { return r.category === cat; });
    if (!rows.length) return;
    tbody.appendChild(el("tr", { class: "group" }, el("td", { colspan: "3", text: t.cat[cat] })));
    rows.forEach(function (r) {

        el("td", { text: r.text }),
        el("td", null, pill(TONE[r.status], t.st[r.status])),
        el("td", { class: "evidence", text: r.evidence })));
    });
  });

    el("thead", null, el("tr", null, el("th", { text: t.requirement }), el("th", { text: t.status }), el("th", { text: t.evidence }))),
    tbody)));

  // Keywords

  [["found", t.kwFound, true], ["missing", t.kwMissing, false]].forEach(function (g) {
    var list = D.keywords.filter(function (k) { return k.found === g[2]; });
    sec.appendChild(el("h3", null, g[1] + " (" + list.length + ")"));
    var chips = el("div", { class: "chips" });
    list.forEach(function (k) {
      chips.appendChild(el("span", { class: "kw " + g[0] + (k.importance === "high" ? " high" : ""), text: k.term }));
    });
    if (!list.length) chips.appendChild(el("span", { class: "empty", text: "–" }));
    sec.appendChild(chips);
  });
  sec.appendChild(el("p", { class: "legend", text: t.kwLegend }));

  // ATS checks
  sec = section(t.atsTitle, t.checksPassed.replace("{n}", S.checks_passed));
  var checks = el("div", { class: "checks" });
  D.ats_checks.forEach(function (c) {
    checks.appendChild(el("div", { class: "check" },
      el("div", { class: "what", text: t.checks[c.id] || c.id }),
      pill(TONE[c.status], t.st[c.status]),
      c.note ? el("div", { class: "why", text: c.note }) : null));
  });
  sec.appendChild(checks);

  // Contradictions
  sec = section(t.contraTitle, D.contradictions.length);
  if (!D.contradictions.length) sec.appendChild(el("p", { class: "empty", text: t.contraNone }));
  else {
    var cards = el("div", { class: "cards" });
    D.contradictions.forEach(function (c) {
      cards.appendChild(el("div", { class: "card" },
        el("div", { class: "head" }, el("strong", { text: c.title }), pill(c.severity === "high" ? "bad" : "warn", t.st[c.severity])),
        el("p", { text: c.detail }),
        (c.sources || []).length ? el("p", { class: "src", text: t.sourcesLabel + ": " + c.sources.join(", ") }) : null));
    });
    sec.appendChild(cards);
  }

  // Proposed changes
  sec = section(t.changes);
  var cols = el("div", { class: "cols" });
  [["remove", t.remove, "rm"], ["add", t.add, "ad"], ["rewrite", t.rewrite, "rw"]].forEach(function (g) {
    var col = el("div", null, el("h3", null, g[1] + " (" + D[g[0]].length + ")"));
    if (!D[g[0]].length) col.appendChild(el("p", { class: "empty", text: t.nothing }));
    else {
      var ul = el("ul");
      D[g[0]].forEach(function (it) {
        ul.appendChild(el("li", { class: g[2] }, it.item, el("span", { text: it.reason }),
          it.needs_confirmation ? el("em", { text: t.confirm }) : null));
      });
      col.appendChild(ul);
    }
    cols.appendChild(col);
  });
  sec.appendChild(cols);

  // Research
  sec = section(t.research, D.research.length);
  if (!D.research.length) sec.appendChild(el("p", { class: "empty", text: t.researchNone }));
  else {
    var rl = el("ul", { class: "research" });
    D.research.forEach(function (r) {
      var src = link(r.source_url, t.source + " ↗");
      rl.appendChild(el("li", null, r.finding,
        r.use ? el("span", { text: t.use + ": " + r.use }) : null,
        src ? el("span", null, src) : null));
    });
    sec.appendChild(rl);
  }

  // Form
  sec = section(t.form, D.questions.length);
  sec.id = "form-section";
  sec.appendChild(el("p", { class: "form-intro", text: t.formIntro }));
  var storeKey = "cv-builder:" + D.meta.company + ":" + D.meta.role + ":" + D.meta.date;
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(storeKey) || "{}"); } catch (e) {}
  var out = el("textarea", { id: "answers-out", readonly: "readonly", "aria-label": t.form });

  D.questions.forEach(function (q, i) {
    var box = el("div", { class: "q" });
    box.dataset.id = q.id;
    if (q.topic) box.appendChild(el("div", { class: "topic", text: (i + 1) + " · " + q.topic }));
    box.appendChild(el("div", { class: "text", text: q.question }));
    var prev = saved[q.id] || {};
    (q.options || []).forEach(function (o) {
      var input = el("input", { type: q.multi ? "checkbox" : "radio", name: "q-" + q.id, value: o.key });
      if ((prev.keys || []).indexOf(o.key) !== -1) input.checked = true;
      box.appendChild(el("label", { class: "opt" }, input, el("b", { text: o.key }),
        el("span", null, o.label, q.recommended === o.key ? el("span", { class: "rec", text: t.recommended }) : null)));
    });
    if (q.allow_custom !== false || !(q.options || []).length) {
      var ta = el("textarea", { "aria-label": t.ownOnly });
      ta.value = prev.text || "";
      box.appendChild(el("label", { class: "own" }, (q.options || []).length ? t.own : t.ownOnly));
      box.appendChild(ta);
    }
    sec.appendChild(box);
  });

  function collect() {
    var state = {}, lines = [t.answersHead + ": " + D.meta.role + " – " + D.meta.company, ""];
    D.questions.forEach(function (q) {
      var box = sec.querySelector('.q[data-id="' + q.id.replace(/"/g, "") + '"]');
      var keys = Array.prototype.map.call(box.querySelectorAll("input:checked"), function (n) { return n.value; });
      var ta = box.querySelector("textarea");
      var text = ta ? ta.value.trim() : "";
      state[q.id] = { keys: keys, text: text };
      var parts = [];
      if (keys.length) parts.push(keys.map(function (k) {
        var opt = q.options.filter(function (o) { return o.key === k; })[0];
        return k + " (" + opt.label + ")";
      }).join(", "));
      if (text) parts.push(t.ownTag + " " + text);
      lines.push(q.id + ": " + (parts.length ? parts.join(" | ") : t.unanswered));
    });
    out.value = lines.join("\n");
    try { localStorage.setItem(storeKey, JSON.stringify(state)); } catch (e) {}
  }
  sec.addEventListener("input", collect);
  sec.addEventListener("change", collect);

  var copied = el("span", { id: "copied", role: "status" });
  var copyBtn = el("button", { type: "button", text: t.copy });
  copyBtn.addEventListener("click", function () {
    collect();
    function done(ok) { copied.textContent = ok ? t.copied : t.copyFail; if (!ok) { out.focus(); out.select(); } }
    function legacy() { out.focus(); out.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} done(ok); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out.value).then(function () { done(true); }, legacy);
    else legacy();
  });
  var resetBtn = el("button", { type: "button", class: "ghost", text: t.reset });
  resetBtn.addEventListener("click", function () {
    Array.prototype.forEach.call(sec.querySelectorAll(".q input"), function (n) { n.checked = false; });
    Array.prototype.forEach.call(sec.querySelectorAll(".q textarea"), function (n) { n.value = ""; });
    copied.textContent = "";
    collect();
  });
  sec.appendChild(el("div", { class: "actions" }, copyBtn, resetBtn, copied));
  sec.appendChild(out);
  collect();

  app.appendChild(el("details", null, el("summary", { text: t.how }), el("p", { text: t.how1 }), el("p", { text: t.how2 })));
})();
</script>
</body>
</html>
